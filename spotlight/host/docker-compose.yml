services:
  spotlight:
    image: ${REPOSITORY:-quay.io/telosalliance/spotlight}:${TAG:-latest}
    container_name: spotlight-${INSTANCE_NAME}
    hostname: spotlight-${INSTANCE_NAME}
    restart: unless-stopped
    environment:
      - HTTPPORT=${HTTPPORT:-80}
      - BEACONURL=https://${BEACONURL}
    network_mode: host
    volumes:
      - /opt/telos/spotlight-${INSTANCE_NAME}:/config:z
      - /etc/telos:/etc/telos:ro
